<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plenty missed calls soundcloud likes shuffled</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #fff; color: #000;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700; font-size: 14px; line-height: 1.5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 26px; padding: 10px 0 40px; box-sizing: border-box;
    -webkit-user-select: none; user-select: none; cursor: pointer;
  }
  h1 {
    margin: 0; width: 100%; font-weight: 700;
    letter-spacing: -.035em; text-transform: lowercase; text-align: left;
    color: #000; opacity: 1;
    white-space: nowrap;
    line-height: 1; height: .74em;   /* short box; width still spans the viewport */
    font-size: 16px; /* replaced by fit() */
  }
  /* scaleY squashes the letters without touching their width, so fit() still holds */
  h1 span {
    display: inline-block;
    transform-origin: left top;   /* transform itself is set by fit() */
  }
  #art {
    width: min(70vw, 50vh, 380px); display: block;
    opacity: 1;
  }
  /* flush left, matching the heading's left edge; unbold against the bold body */
  #meta { width: 100%; text-align: left; font-weight: 400; padding: 3px; box-sizing: border-box; }
  #sub { margin: 0 0 2px; font-size: 19px; line-height: 1.35; color: #000; }
  #now { margin: 0; max-width: 40ch; min-height: 3em; }
  #t { display: block; font-size: 19px; line-height: 1.35; color: #000; }
  #a { display: block; font-size: 16px; letter-spacing: .06em; color: #000; opacity: 1; margin-top: 4px; font-weight: 700; }
  #sc { position: fixed; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; }
</style>
</head>
<body>

<h1><span id="hd">plenty missed calls</span></h1>
<div id="meta">
  <p id="sub">soundcloud likes: shuffled</p>
  <p id="now"><span id="t">tap to play</span><span id="a"></span></p>
</div>
<img id="art" alt="">
<iframe id="sc" allow="autoplay" src="about:blank"></iframe>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
(() => {
  const art = document.getElementById('art');
  const tEl = document.getElementById('t');
  const aEl = document.getElementById('a');
  const frame = document.getElementById('sc');

  (function pic(list) {
    if (!list.length) { art.style.display = 'none'; return; }
    art.onerror = () => pic(list.slice(1));
    art.src = list[0];
  })(['image.jpg', 'image.jpeg', 'image.png', 'image.gif', 'image.webp']);

  // Scale the heading so its INK spans the full viewport width. Measuring the
  // layout box leaves a gap at the left, because the p carries a left side
  // bearing the s has no matching right one for. TextMetrics reports the real
  // ink bounds, so we size by those and shift the bearing back off the edge.
  const head = document.querySelector('h1'), headSpan = document.getElementById('hd');
  const cv = document.createElement('canvas').getContext('2d');
  const TRACK = -.035, SQUASH = .7;   // must match the CSS letter-spacing / scaleY

  function fit() {
    const avail = head.clientWidth;
    if (!avail) return;
    cv.font = '700 100px Arial, Helvetica, sans-serif';
    const tracks = 'letterSpacing' in cv;
    if (tracks) cv.letterSpacing = (TRACK * 100) + 'px';
    const m = cv.measureText(headSpan.textContent);
    const left = m.actualBoundingBoxLeft;          // negative when ink starts right of the origin
    let right = m.actualBoundingBoxRight;
    if (!tracks) right += TRACK * 100 * (headSpan.textContent.length - 1);
    const ink = right + left;
    if (!(ink > 0)) return;
    const scale = avail / ink;
    head.style.fontSize = (100 * scale) + 'px';
    headSpan.style.transform = 'translateX(' + (left * scale) + 'px) scaleY(' + SQUASH + ')';
  }
  fit();
  addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  let queue = [], i = -1, widget = null, started = false, playing = false, guard = null;

  // Fisher-Yates over the entire library, crypto-seeded. One full pass = every
  // like exactly once, then a fresh shuffle. No repeats until everything played.
  const shuffle = (a) => {
    for (let j = a.length - 1; j > 0; j--) {
      const k = crypto.getRandomValues(new Uint32Array(1))[0] % (j + 1);
      [a[j], a[k]] = [a[k], a[j]];
    }
    return a;
  };

  const widgetSrc = (url) =>
    'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) +
    '&auto_play=true&show_artwork=false&visual=false&buying=false&sharing=false&liking=false';

  function next() {
    clearTimeout(guard);
    i++;
    if (i >= queue.length) { shuffle(queue); i = 0; }
    const t = queue[i];
    tEl.textContent = t.title;
    aEl.textContent = t.artist || '';
    // if a track refuses to load (pulled, geo-blocked, embed-disabled), move on
    guard = setTimeout(next, 14000);
    if (widget) widget.load(t.url, { auto_play: true });
    else frame.src = widgetSrc(t.url);
  }

  function bind() {
    widget = SC.Widget(frame);
    const E = SC.Widget.Events;
    widget.bind(E.PLAY,   () => { clearTimeout(guard); playing = true; document.body.classList.add('playing'); });
    widget.bind(E.PAUSE,  () => { playing = false; document.body.classList.remove('playing'); });
    widget.bind(E.FINISH, next);
    widget.bind(E.ERROR,  next);
  }

  fetch('likes.json')
    .then(r => r.json())
    .then(list => { queue = shuffle(list.slice()); tEl.textContent = 'tap to play'; })
    .catch(() => { tEl.textContent = 'likes.json missing'; });

  // one tap starts it; after that taps do nothing, so it can't be paused by accident
  function start() {
    if (started || !queue.length) return;
    started = true;
    document.body.style.cursor = 'default';
    next();
    frame.addEventListener('load', function once() { frame.removeEventListener('load', once); bind(); });
  }

  document.body.addEventListener('click', start);
  addEventListener('keydown', (e) => {
    if (!started) { if (e.code === 'Space') { e.preventDefault(); start(); } return; }
    if (e.code === 'Space' && widget) { e.preventDefault(); playing ? widget.pause() : widget.play(); }
    if (e.code === 'ArrowRight') next();
  });
})();
</script>
</body>
</html>
