<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plenty missed calls soundcloud likes shuffled</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #fff; color: #000;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700; font-size: 14px; line-height: 1.5;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 0; padding: 10px 0 40px; box-sizing: border-box;
    -webkit-user-select: none; user-select: none; cursor: pointer;
  }
  h1 {
    margin: 0; width: 100%; font-weight: 700;
    letter-spacing: -.035em; text-transform: lowercase; text-align: left;
    color: #000; opacity: 1;
    white-space: nowrap;
    line-height: 1;                  /* height and font-size are set by fit() */
    font-size: 16px;
  }
  /* scaleY squashes the letters without touching their width, so fit() still holds */
  h1 span {
    display: inline-block;
    transform-origin: left top;   /* transform itself is set by fit() */
  }
  /* zero-sized inline-block: its bottom edge sits exactly on the baseline, which
     is how fit() locates the baseline without guessing at line-box metrics */
  #bl { display: inline-block; width: 0; height: 0; }
  /* out of flow, so a long title or artist can never push it around */
  #art {
    position: fixed; top: calc(50% + 24px); left: 50%; transform: translate(-50%, -50%);
    width: min(70vw, 50vh, 380px); display: block; margin: 0;
    opacity: 1;
  }
  /* flush left, matching the heading's left edge; unbold against the bold body */
  /* no left pad, so the copy starts on the heading's ink edge; one size and
     one leading across all three lines with no margins, so the white between
     them is identical */
  /* 3.25px + 3px pad + the 5.58px of white inside the first line's own line box
     == the 11.83px of white between the copy lines. See the commit message. */
  #meta { width: 100%; text-align: left; font-weight: 400; padding: 3px 0; box-sizing: border-box; margin-top: 3.25px; }
  #sub, #t, #a { display: block; margin: 0; font-size: 19px; line-height: 1.35; color: #000; }
  #now { margin: 0; max-width: 40ch; min-height: 2.7em; }
  #a { letter-spacing: .06em; font-weight: 700; }
  #sc { position: fixed; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; }
  /* WebKit refuses to autoplay a hidden cross-origin frame and a play() from
     the parent carries no gesture into it, so when autoplay is declined we
     surface the real widget for one tap and hide it again once sound starts */
  /* ?debug=1 -- event trace, so a silent player can be read without a console */
  #log {
    position: fixed; top: 0; right: 0; z-index: 9; margin: 0; padding: 6px 8px;
    max-width: 46vw; max-height: 100vh; overflow: auto; pointer-events: none;
    font: 400 11px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap;
    background: rgba(255,255,255,.92); color: #000; letter-spacing: 0;
  }
  body.tap #sc {
    position: static; left: auto; width: 100%; max-width: 420px; height: 120px;
    opacity: 1; pointer-events: auto; align-self: flex-start; margin-top: 10px;
  }
</style>
</head>
<body>

<h1><span id="hd">plenty missed calls<i id="bl"></i></span></h1>
<div id="meta">
  <p id="sub">soundcloud likes: shuffled</p>
  <p id="now"><span id="t">tap to play</span><span id="a"></span></p>
</div>
<img id="art" alt="">
<iframe id="sc" allow="autoplay; encrypted-media" src="about:blank"></iframe>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
(() => {
  const art = document.getElementById('art');
  const tEl = document.getElementById('t');
  const aEl = document.getElementById('a');
  const frame = document.getElementById('sc');

  (function pic(list) {
    if (!list.length) { art.style.display = 'none'; return; }
    art.onerror = () => pic(list.slice(1));
    art.src = list[0];
  })(['image.jpg', 'image.jpeg', 'image.png', 'image.gif', 'image.webp']);

  // Scale the heading so its INK spans the viewport. The layout box is the
  // wrong thing to measure: the p carries a fat left side bearing that the s
  // has no counterpart for, so a box-flush line looks inset on the left. Find
  // the ink the unambiguous way -- rasterise the text once and scan for the
  // first and last lit column. Ink metrics are scale-invariant, so measure at
  // 100px, keep them in em, and reuse them on every resize.
  const head = document.querySelector('h1'), headSpan = document.getElementById('hd');
  const probe = document.getElementById('bl');
  const TRACK = -.035, SQUASH = .7;   // must match the CSS letter-spacing / scaleY
  let ink = null;

  // Rasterise the heading once and scan for the lit pixels. This gives the real
  // ink box -- left bearing, width, and the top/bottom relative to the baseline
  // -- with no TextMetrics sign conventions to get wrong. Ink is scale
  // invariant, so measure at 100px, keep it in em, and reuse it on resize.
  function measure() {
    const text = headSpan.textContent, S = 100, pad = 200, BY = S * 1.3;
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(text.length * S) + pad * 2;
    cv.height = S * 2;
    const c = cv.getContext('2d', { willReadFrequently: true });
    c.font = '700 ' + S + 'px Arial, Helvetica, sans-serif';
    c.textBaseline = 'alphabetic';
    c.fillStyle = '#000';
    if ('letterSpacing' in c) {
      c.letterSpacing = (TRACK * S) + 'px';
      c.fillText(text, pad, BY);
    } else {                       // older Safari: lay the characters out by hand
      let x = pad;
      for (const ch of text) { c.fillText(ch, x, BY); x += c.measureText(ch).width + TRACK * S; }
    }
    const w = cv.width, h = cv.height, d = c.getImageData(0, 0, w, h).data;
    let x0 = -1, x1 = -1, y0 = -1, y1 = -1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (d[(y * w + x) * 4 + 3]) {
          if (y0 < 0) y0 = y;
          y1 = y;
          if (x0 < 0 || x < x0) x0 = x;
          if (x > x1) x1 = x;
        }
      }
    }
    if (x0 < 0) return null;
    return { lsb: (x0 - pad) / S, w: (x1 - x0 + 1) / S,
             top: (y0 - BY) / S,  bot: (y1 + 1 - BY) / S };
  }

  // Size the type so its ink spans the viewport, then translate so the ink box
  // sits flush against the h1's top-left and set the h1's height to the ink
  // height. The box then hugs the letters exactly, so the space below the
  // heading is whatever CSS says it is, independent of type size.
  function fit() {
    const avail = head.clientWidth;
    if (!avail) return;
    if (!ink) ink = measure();
    if (!ink || !(ink.w > 0)) return;
    const size = avail / ink.w;
    head.style.fontSize = size + 'px';
    headSpan.style.transform = 'none';
    head.style.height = 'auto';
    const base = probe.getBoundingClientRect().bottom - headSpan.getBoundingClientRect().top;
    const top = (base + ink.top * size) * SQUASH;
    const bot = (base + ink.bot * size) * SQUASH;
    headSpan.style.transform =
      'translate(' + (-ink.lsb * size) + 'px,' + (-top) + 'px) scaleY(' + SQUASH + ')';
    head.style.height = (bot - top) + 'px';
  }

  fit();
  addEventListener('resize', fit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { ink = null; fit(); });

  let queue = [], i = -1, widget = null, started = false, playing = false;
  let guard = null, nudge = null, waiting = false;
  const subEl = document.getElementById('sub'), SUB = subEl.textContent;

  const DEBUG = /[?&]debug/.test(location.search);
  let logEl = null;
  function log(m) {
    if (!DEBUG) return;
    if (!logEl) { logEl = document.createElement('pre'); logEl.id = 'log'; document.body.appendChild(logEl); }
    logEl.textContent += m + '\n';
  }

  // Fisher-Yates over the entire library, crypto-seeded. One full pass = every
  // like exactly once, then a fresh shuffle. No repeats until everything played.
  const shuffle = (a) => {
    for (let j = a.length - 1; j > 0; j--) {
      const k = crypto.getRandomValues(new Uint32Array(1))[0] % (j + 1);
      [a[j], a[k]] = [a[k], a[j]];
    }
    return a;
  };

  const widgetSrc = (url) =>
    'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) +
    '&auto_play=true&show_artwork=false&visual=false&buying=false&sharing=false&liking=false';

  function next() {
    clearTimeout(guard);
    i++;
    if (i >= queue.length) { shuffle(queue); i = 0; }
    const t = queue[i];
    tEl.textContent = t.title;
    aEl.textContent = t.artist || '';
    // if a track refuses to load (pulled, geo-blocked, embed-disabled), move on
    // -- but never skip while we're waiting on the listener to tap the widget
    guard = setTimeout(() => { if (!waiting) next(); }, 14000);
    log('next -> ' + t.title);
    if (widget) widget.load(t.url, { auto_play: true, callback: () => widget.play() });
    else frame.src = widgetSrc(t.url);
  }

  function reveal(msg) { waiting = true; document.body.classList.add('tap'); subEl.textContent = msg; }
  // Deliberately does NOT re-hide the frame: WebKit suspends media in a frame
  // it treats as invisible, so pulling it back to 1px/off-screen the instant
  // PLAY fires kills the sound that just started. Once it's up, it stays up.
  function settle()    { waiting = false; subEl.textContent = SUB; }

  function bind() {
    if (typeof SC === 'undefined' || !SC.Widget) { subEl.textContent = 'player failed to load'; log('SC.Widget MISSING'); return; }
    widget = SC.Widget(frame);
    const E = SC.Widget.Events;
    log('bound');
    widget.bind(E.READY,  () => {
      log('READY');
      widget.getCurrentSound(snd => log(snd
        ? 'sound: ' + snd.title + '\n  streamable=' + snd.streamable + ' policy=' + snd.policy +
          ' monetization=' + snd.monetization_model + ' kind=' + snd.kind + ' duration=' + snd.duration
        : 'sound: NONE'));
      widget.play();
    });
    widget.bind(E.PLAY,   () => { log('PLAY'); clearTimeout(guard); clearTimeout(nudge); playing = true; settle();
      widget.getVolume(v => log('  volume=' + v));
      setTimeout(() => widget.getPosition(pos => log('  position after 2s = ' + pos + 'ms')), 2000); });
    widget.bind(E.PAUSE,  () => { log('PAUSE'); playing = false; });
    widget.bind(E.FINISH, () => { log('FINISH'); next(); });
    widget.bind(E.ERROR,  () => { log('ERROR'); next(); });
  }

  fetch('likes.json')
    .then(r => r.json())
    .then(list => { queue = shuffle(list.slice()); tEl.textContent = 'tap to play'; log('queue ' + queue.length); })
    .catch(() => { tEl.textContent = 'likes.json missing'; });

  // one tap starts it; after that taps do nothing, so it can't be paused by accident
  function start() {
    if (started || !queue.length) return;
    started = true;
    log('tap');
    document.body.style.cursor = 'default';
    next();
    frame.addEventListener('load', function once() { frame.removeEventListener('load', once); bind(); });
    // autoplay refused (Safari, and Chrome without prior engagement): show the
    // widget so the tap can land inside the frame, which grants it playback
    nudge = setTimeout(() => { if (!playing) reveal('press play once below'); }, 1800);
  }

  document.body.addEventListener('click', start);
  addEventListener('keydown', (e) => {
    if (!started) { if (e.code === 'Space') { e.preventDefault(); start(); } return; }
    if (e.code === 'Space' && widget) { e.preventDefault(); playing ? widget.pause() : widget.play(); }
    if (e.code === 'ArrowRight') next();
  });
})();
</script>
</body>
</html>
